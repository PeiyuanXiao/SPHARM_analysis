name: Reproducibility Check

# Builds the project Docker image (R + renv library + conda `spharm`
# environment) and runs a partial validation of the analysis pipeline.
#
# NOTE: A full `targets::tar_make()` is intentionally NOT run here. The
# pipeline depends on the 3D core meshes (analysis/data/3D_models_cores/*.stl),
# which are too large for version control and are archived separately (see
# README). This workflow therefore verifies that the computational
# environment builds reproducibly and that the pipeline + Python modules load,
# rather than executing the data-dependent stages.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        # The rocker/geospatial base + renv library + conda env produce a
        # large image; reclaim space the GitHub-hosted runner does not need.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: spharm_analysis:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate that the targets pipeline parses
        # tar_manifest() sources _targets.R and lists every target without
        # executing any commands, so it needs no data. A non-empty manifest
        # confirms the pipeline definition is well-formed.
        run: |
          docker run --rm -w /project spharm_analysis:ci \
            Rscript -e 'm <- targets::tar_manifest(); stopifnot(nrow(m) > 0); cat("Pipeline parsed:", nrow(m), "targets\n"); print(m$name)'

      - name: Validate the conda `spharm` Python environment
        # Imports the project entry point and supporting modules using the
        # same PYTHONPATH the pipeline uses (see python_env() in _targets.R).
        # This confirms the conda env solved correctly and the Python code
        # (pyshtools, trimesh, SPHARM_modules, ...) loads.
        run: |
          docker run --rm \
            -e PYTHONPATH=/project/analysis/scripts/SPHARM_main:/project/analysis/scripts \
            -e MPLBACKEND=Agg \
            -w /project spharm_analysis:ci \
            /opt/conda/envs/spharm/bin/python -c "import SPHARM_main; import SPHARM_modules.statistics_analysis; print('Python SPHARM environment import OK')"
