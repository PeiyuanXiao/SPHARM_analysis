name: Reproducibility Check

# Full reproduction in CI:
#   1. Build the project Docker image (R + renv library + conda `spharm` env).
#   2. Download the 3D core meshes from OSF (they are too large for version
#      control and live in an OSF project).
#   3. Run the complete `targets::tar_make()` pipeline inside the image with
#      the repository mounted, then render the manuscript.
#
# The OSF project that hosts the meshes is public
# (https://doi.org/10.17605/OSF.IO/d82c5), so the download needs no token or
# secret. If it is ever made private again, add an OSF_VIEW_ONLY_TOKEN
# repository secret and append `&view_only=<token>` to the download URL.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  # OSF project node that stores the 3D core meshes (.stl); it appears in the
  # public OSF URL (https://doi.org/10.17605/OSF.IO/d82c5).
  OSF_NODE: d82c5

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        # The base image + renv library + conda env + downloaded meshes are
        # large; reclaim space the GitHub-hosted runner does not need.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: spharm_analysis:ci
          load: true
          cache-from: type=gha
          # Layer cache is only a build speed-up for this reproducibility job, so
          # a flaky cache export must never fail the run (ignore-error=true). The
          # Dockerfile is single-stage, so mode=min already caches every expensive
          # layer (renv::restore, conda env create); mode=max would only add value
          # for multi-stage builds and bloats the export past the 10 GB repo cache
          # quota, which triggered the "exporting to cache ... ERROR: not_found".
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Sanity-check the conda `spharm` Python environment
        # Fast early failure: confirm the env solved and the project modules
        # import (same PYTHONPATH the pipeline uses; see python_env() in _targets.R).
        run: |
          docker run --rm \
            -e PYTHONPATH=/project/analysis/scripts/SPHARM_main:/project/analysis/scripts \
            -e MPLBACKEND=Agg \
            -w /project spharm_analysis:ci \
            /opt/conda/envs/spharm/bin/python -c "import SPHARM_main; import SPHARM_modules.statistics_analysis; print('Python SPHARM environment import OK')"

      - name: Download 3D core meshes from OSF
        run: |
          set -euo pipefail
          DEST="analysis/data/3D_models_cores"
          mkdir -p "$DEST"
          # Public OSF project (https://doi.org/10.17605/OSF.IO/d82c5); no token needed.
          URL="https://files.osf.io/v1/resources/${OSF_NODE}/providers/osfstorage/?zip="
          echo "Downloading meshes from public OSF node ${OSF_NODE} ..."
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o models.zip
          unzip -o -q models.zip -d "$DEST"
          rm -f models.zip
          COUNT=$(find "$DEST" -iname '*.stl' | wc -l)
          echo "Downloaded ${COUNT} .stl files into ${DEST}"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No .stl files were downloaded. Check OSF_NODE (${OSF_NODE})."
            exit 1
          fi

      - name: Run the full targets pipeline (tar_make)
        # Mount the checkout (code + downloaded meshes) over /project. The renv
        # library (/opt/renv) and conda env (/opt/conda) are baked into the
        # image and remain available; .Rprofile activates renv automatically.
        run: |
          docker run --rm \
            -e MPLBACKEND=Agg \
            -v "${{ github.workspace }}":/project -w /project \
            spharm_analysis:ci \
            Rscript -e 'targets::tar_make()'
          # files written by the (root) container; make them readable to the runner
          sudo chown -R "$USER":"$USER" "${{ github.workspace }}" || true

      - name: Build the supplementary (robustness) pipeline
        # Independent SI pipeline (_targets_supplementary.R). It reads the
        # committed per-setting spectra under analysis/robustness/**/spectra plus
        # the main pipeline's derived CSVs (SPHARM_direction/morphology.csv,
        # written by the previous step into the mounted workspace) and builds the
        # robustness figures/tables into its own store
        # (analysis/robustness/_targets_store). No Python is involved.
        # Best-effort: a failure here does not fail the reproducibility job — flip
        # to a gating step (remove continue-on-error) once confirmed green in CI.
        continue-on-error: true
        run: |
          docker run --rm \
            -e MPLBACKEND=Agg \
            -v "${{ github.workspace }}":/project -w /project \
            spharm_analysis:ci \
            Rscript -e 'Sys.setenv(TAR_PROJECT = "supplementary"); targets::tar_make()'
          sudo chown -R "$USER":"$USER" "${{ github.workspace }}" || true

      - name: Render the manuscript
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project -w /project \
            spharm_analysis:ci \
            quarto render analysis/paper/manuscript.qmd --to docx
          sudo chown -R "$USER":"$USER" "${{ github.workspace }}" || true

      - name: Render the supplementary materials
        # supplementary.qmd sets its own targets store (the robustness store
        # built above) and renders the sensitivity analysis to ESM_1.docx
        # (per its `output-file`).
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project -w /project \
            spharm_analysis:ci \
            quarto render analysis/paper/supplementary.qmd --to docx
          sudo chown -R "$USER":"$USER" "${{ github.workspace }}" || true

      - name: Upload reproduced outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-outputs
          if-no-files-found: ignore
          # derived_data holds large binary intermediates (.npy KDE grids/matrices,
          # .rds) alongside the tabular results; ship only the CSV tables. `**`
          # matches zero or more directories, so this captures both the top-level
          # CSVs (e.g. SPHARM_morphology.csv) and nested ones (validation/**).
          path: |
            analysis/paper/manuscript.docx
            analysis/paper/ESM_1.docx
            analysis/data/derived_data/**/*.csv
