services:
  spharm-processor:
    image: spharm_analysis
    # Match the image's build platform. No-op on amd64 hosts; on Apple Silicon
    # it runs the amd64 image under emulation instead of warning about a mismatch.
    platform: linux/amd64
    container_name: spharm-processor
    ports:
      - "8787:8787"
    environment:
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - PASSWORD=${RSTUDIO_PASSWORD:-spharm}
      - RENV_PATHS_LIBRARY=/opt/renv/library
      - RENV_PATHS_CACHE=/opt/renv/cache
    volumes:
      # mount the project (the directory containing this compose file) at /project
      - .:/project
    working_dir: /project
    stop_grace_period: 1s
    restart: "no"